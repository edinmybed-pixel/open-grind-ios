name: Probe runners
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "linux runner ok"; uname -a
  mac:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Toolchain facts
        run: |
          uname -a
          sw_vers
          ls -d /Applications/Xcode*
          export DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-build-version
          xcrun --sdk iphoneos --show-sdk-version
          which nix bun cargo rustup || true
          sysctl -n hw.ncpu hw.memsize
          df -h /
